name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Get latest YSMParser version
        id: ysm-version
        run: |
          TAG=$(curl -sH "Accept: application/vnd.github+json" \
            https://api.github.com/repos/OpenYSM/YSMParser/releases/latest | \
            jq -r '.tag_name')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "YSMParser version: $TAG"
          
          # 下载 wasm 文件到 public 目录
          mkdir -p public/wasm
          curl -sL "https://github.com/OpenYSM/YSMParser/releases/download/${TAG}/YSMParser-${TAG#v}-wasm-web.tar.gz" \
            -o public/wasm/ysm-parser.tar.gz
          echo "Downloaded wasm file"

      - name: Build with Next.js
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_YSM_TAG: ${{ steps.ysm-version.outputs.tag }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4